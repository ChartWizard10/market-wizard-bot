name: Phase 14W2 Surgical Parity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: ${{ github.head_ref == 'phase-14w2-manual-analyze-parity-surgical' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Phase 14W2 branch
        uses: actions/checkout@v4
        with:
          ref: phase-14w2-manual-analyze-parity-surgical
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply surgical shared-judgment refactor
        run: python tools/phase14w2_surgical.py

      - name: Compile and run full scanner test suite
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m compileall -q src tests main.py
          python -m pytest -q

      - name: Commit production-only Phase 14W2 result
        run: |
          rm .github/workflows/phase14w2-surgical.yml
          rm tools/phase14w2_surgical.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 14W2 unify manual and autoscan judgment surgically"
          git push origin HEAD:phase-14w2-manual-analyze-parity-surgical
