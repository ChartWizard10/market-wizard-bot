name: SFC-1 Compiler Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: ${{ github.head_ref == 'phase-sfc1-setup-family-compiler' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-sfc1-setup-family-compiler
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/setup_family_compiler.py')
          text = p.read_text(encoding='utf-8')
          assert text.count('@dataclass(frozen=True)') == 1
          text = text.replace('@dataclass(frozen=True)', '@dataclass', 1)
          p.write_text(text, encoding='utf-8')

          t = Path('tests/test_setup_family_compiler.py')
          text = t.read_text(encoding='utf-8')
          old = '137.2 if close_above else 133.0'
          new = '137.2 if close_above else 125.0'
          assert text.count(old) == 1
          t.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile and run full tests
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m compileall -q src tests main.py
          python -m pytest -q

      - name: Commit green compiler
        run: |
          rm .github/workflows/sfc1-fix.yml
          rm -f .sfc1-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SFC-1 fix sovereignty term and cradle no-reclaim fixture"
          git push origin HEAD:phase-sfc1-setup-family-compiler
