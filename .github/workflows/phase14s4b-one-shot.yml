name: Phase 14S.4B One-Shot Reconciliation

on:
  push:
    branches: [phase-14s4b-final-tier-dedup-current-main]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-14s4b-final-tier-dedup-current-main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reconcile telemetry documentation and architecture guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          telemetry = Path('src/scan_telemetry.py')
          text = telemetry.read_text(encoding='utf-8')

          old = '''CHECK_ALERT ORDERING (measured, deliberately NOT fixed here)
          ------------------------------------------------------------
          `check_alert` runs at scheduler Step 6, BEFORE ladder arbitration (6.592) and
          the seal (6.595). A row can therefore be evaluated for cooldown as NEAR_ENTRY
          and later be served as SNIPE_IT while retaining that decision. 14V records both
          `check_alert_evaluated_tier` and the final served tier so the frequency of that
          architecture can be measured. It does not change check_alert timing.
          '''
          new = '''CHECK_ALERT ORDERING (Phase 14S.4B reconciled)
          ------------------------------------------------------
          `check_alert` now runs exactly once AFTER ladder arbitration, the universal
          SNIPE capital floor, and the downgrade-only SNIPE seal, and immediately before
          Discord delivery. Cooldown / tier-improvement therefore evaluates the FINAL
          executable tier. `base_final_tier` remains separately persisted so the ledger
          still preserves the pre-arbitration tier. Historical pre-14S.4B traces may
          legitimately carry `check_alert_evaluated_tier != final_tier`; telemetry never
          rewrites those old facts.
          '''
          assert text.count(old) == 1, 'telemetry ordering doctrine block changed unexpectedly'
          text = text.replace(old, new)

          old = '''            # M1 — the tier check_alert ACTUALLY evaluated. check_alert runs at
                      # Step 6, before the ladder; final_tier above may be higher. The
                      # ledger must never imply the final tier was the decision basis.
          '''
          new = '''            # M1 / Phase 14S.4B — the tier check_alert ACTUALLY evaluated.
                      # Current scans evaluate the final executable tier after ladder/floor/seal.
                      # Historical pre-14S.4B traces may legitimately differ from final_tier;
                      # the ledger preserves the caller-supplied historical decision basis.
          '''
          assert text.count(old) == 1, 'telemetry inline M1 comment changed unexpectedly'
          telemetry.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_phase_14v_scan_time_funnel_telemetry.py')
          text = tests.read_text(encoding='utf-8')

          old = '''def test_v1_m1_check_alert_evaluated_tier_is_the_pre_ladder_tier(tmp_path):
              """15, 16 — the ledger must never imply the FINAL tier was the basis."""
          '''
          new = '''def test_v1_m1_legacy_trace_preserves_pre_ladder_check_alert_basis(tmp_path):
              """Historical pre-14S.4B traces preserve the tier check_alert actually saw.

              This fixture models the old pipeline deliberately. It is serialization
              provenance, not the current runtime ordering contract.
              """
          '''
          assert text.count(old) == 1, 'legacy M1 test signature changed unexpectedly'
          text = text.replace(old, new)

          old = '''def test_v1_check_alert_timing_was_not_changed():
              """The ordering is MEASURED, not fixed. check_alert must still run before
              the ladder, and must not be re-run afterwards."""
              src = Path("src/scheduler.py").read_text(encoding="utf-8")
              scan = src[src.index("async def run_scan_pipeline"):src.index("async def run_full_scan")]
              assert scan.count("state_store.check_alert(") == 1
              assert scan.index("state_store.check_alert(") < scan.index("apply_ladder_arbitration")
          '''
          new = '''def test_v1_check_alert_runs_once_after_final_tier_mutation():
              """Phase 14S.4B law: judge first, dedup final executable truth second."""
              src = Path("src/scheduler.py").read_text(encoding="utf-8")
              scan = src[src.index("async def run_scan_pipeline"):src.index("async def run_full_scan")]
              assert scan.count("state_store.check_alert(") == 1
              assert scan.index("apply_ladder_arbitration") < scan.index("state_store.check_alert(")
              assert scan.index("seal_snipe_confirmed_consistency") < scan.index("state_store.check_alert(")
              assert scan.index("state_store.check_alert(") < scan.index("discord_alerts.send_alert")
          '''
          assert text.count(old) == 1, 'first active timing guard changed unexpectedly'
          text = text.replace(old, new)

          old = '''def test_v1c_24_25_check_alert_timing_and_cap_unchanged():
              src = Path("src/scheduler.py").read_text(encoding="utf-8")
              scan = src[src.index("async def run_scan_pipeline"):src.index("async def run_full_scan")]
              assert scan.count("state_store.check_alert(") == 1
              assert scan.index("state_store.check_alert(") < scan.index("apply_ladder_arbitration")
              import yaml
              cfg = yaml.safe_load(open("config/doctrine_config.yaml"))
              assert cfg["prefilter"]["max_claude_candidates_per_scan"] == 30
          '''
          new = '''def test_v1c_24_25_check_alert_final_tier_timing_and_cap_unchanged():
              src = Path("src/scheduler.py").read_text(encoding="utf-8")
              scan = src[src.index("async def run_scan_pipeline"):src.index("async def run_full_scan")]
              assert scan.count("state_store.check_alert(") == 1
              assert scan.index("apply_ladder_arbitration") < scan.index("state_store.check_alert(")
              assert scan.index("seal_snipe_confirmed_consistency") < scan.index("state_store.check_alert(")
              assert scan.index("state_store.check_alert(") < scan.index("discord_alerts.send_alert")
              import yaml
              cfg = yaml.safe_load(open("config/doctrine_config.yaml"))
              assert cfg["prefilter"]["max_claude_candidates_per_scan"] == 30
          '''
          assert text.count(old) == 1, 'second active timing guard changed unexpectedly'
          tests.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Compile and run full scanner test suite
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m compileall -q src tests main.py
          python -m pytest -q

      - name: Commit reconciled contracts and remove one-shot workflow
        run: |
          rm .github/workflows/phase14s4b-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scan_telemetry.py tests/test_phase_14v_scan_time_funnel_telemetry.py .github/workflows/phase14s4b-one-shot.yml
          git commit -m "Phase 14S.4B align telemetry with final-tier dedup"
          git push origin HEAD:phase-14s4b-final-tier-dedup-current-main
