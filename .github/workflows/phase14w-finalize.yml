name: Phase 14W Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: ${{ github.head_ref == 'phase-14w-manual-analyze-parity' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Phase 14W branch
        uses: actions/checkout@v4
        with:
          ref: phase-14w-manual-analyze-parity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Point HTF ordering guard at shared judgment organ
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_phase_14i_higher_timeframe_context.py')
          text = p.read_text(encoding='utf-8')
          old = 'src = inspect.getsource(scheduler.run_scan_pipeline)'
          new = 'src = inspect.getsource(scheduler._complete_candidate_judgment)'
          assert text.count(old) == 1, 'HTF scheduler ordering guard changed unexpectedly'
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile and run full scanner test suite
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m compileall -q src tests main.py
          python -m pytest -q

      - name: Commit final Phase 14W production branch
        run: |
          rm .github/workflows/phase14w-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 14W align HTF architecture guard with shared judgment organ"
          git push origin HEAD:phase-14w-manual-analyze-parity
