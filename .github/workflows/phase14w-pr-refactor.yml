name: Phase 14W PR Refactor Runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  refactor:
    if: ${{ github.head_ref == 'phase-14w-manual-analyze-parity' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Phase 14W branch
        uses: actions/checkout@v4
        with:
          ref: phase-14w-manual-analyze-parity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply deterministic shared-judgment refactor
        run: python tools/phase14w_refactor.py

      - name: Compile and run full scanner test suite
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m compileall -q src tests main.py
          python -m pytest -q

      - name: Remove one-shot scaffolding and commit production change
        run: |
          rm -f .github/workflows/phase14w-one-shot.yml
          rm -f .github/workflows/phase14w-pr-refactor.yml
          rm -f .phase14w-trigger
          rm -f tools/phase14w_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 14W unify manual and autoscan judgment pipeline"
          git push origin HEAD:phase-14w-manual-analyze-parity
