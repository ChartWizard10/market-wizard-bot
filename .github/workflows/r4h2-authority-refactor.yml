name: Phase R4H-2 Authority Handoff Refactor

on:
  push:
    branches: [phase-r4h2-real-four-hour-authority]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-r4h2-real-four-hour-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply R4H-2 authority handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, f'{label}: expected 1 match, got {count}'
              p.write_text(text.replace(old, new), encoding='utf-8')

          # -----------------------------------------------------------------
          # four_hour_authority: explicit production opt-in preserves old unit
          # callers/configs; deployed doctrine_config sets the flag true.
          # -----------------------------------------------------------------
          replace_once(
              'src/four_hour_authority.py',
              '        return cfg.get("real_4h_authority_enabled", True) is not False\n'
              '    except Exception:\n'
              '        # Unknown config state must not silently disable the production authority.\n'
              '        return True\n',
              '        return cfg.get("real_4h_authority_enabled") is True\n'
              '    except Exception:\n'
              '        return False\n',
              'authority explicit opt-in',
          )

          # -----------------------------------------------------------------
          # Scheduler: 1H -> legacy proxy snapshot -> REAL 4H -> authority ->
          # MTF. The same 60m envelope feeds 1H and 4H. Then ladder -> R4H-2
          # capital floor -> downgrade-only seal.
          # -----------------------------------------------------------------
          replace_once(
              'src/scheduler.py',
              'from src import four_hour_operational\n',
              'from src import four_hour_authority\nfrom src import four_hour_operational\n',
              'scheduler authority import',
          )
          replace_once(
              'src/scheduler.py',
              '      trajectory -> trade location -> candle evidence -> 1H trigger -> MTF\n'
              '      alignment -> real 4H shadow evidence -> HTF context -> SNIPE gate audit\n'
              '      -> SNIPE ladder -> downgrade-only seal -> final audit reconcile\n'
              '      -> score calibration.\n',
              '      trajectory -> trade location -> candle evidence -> 1H trigger -> REAL 4H\n'
              '      operational authority -> MTF alignment -> HTF context -> SNIPE gate audit\n'
              '      -> SNIPE ladder -> R4H-2 capital floor -> downgrade-only seal\n'
              '      -> final audit reconcile -> score calibration.\n',
              'scheduler helper doctrine',
          )

          old_block = '''    # Phase 14F proxy remains authoritative until R4H-2. Real 4H is attached
              # immediately afterwards from the SAME 60m response, with zero extra fetch.
              try:
                  tiering_result["timeframe_alignment"] = timeframe_alignment.build_timeframe_alignment_context(
                      ticker,
                      tiering_result,
                      enriched_data=enriched,
                      config=config,
                  )
              except Exception as exc:
                  log.warning("TIMEFRAME_ALIGNMENT_ERROR: %s: %s", ticker, exc)
                  tiering_result["timeframe_alignment"] = timeframe_alignment.error_timeframe_alignment_object(str(exc))
          
              try:
                  env = one_hour_envelope if isinstance(one_hour_envelope, dict) else {}
                  tiering_result["four_hour_operational"] = four_hour_operational.build_four_hour_operational_context(
                      ticker,
                      tiering_result,
                      enriched_data=enriched,
                      four_hour_bars=env.get("four_hour"),
                      config=config,
                  )
                  log.info(four_hour_operational.render_four_hour_log_line(
                      ticker,
                      tiering_result["four_hour_operational"],
                      tiering_result["four_hour_operational"].get("proxy_comparison"),
                  ))
              except Exception as exc:
                  log.warning("FOUR_HOUR_OPERATIONAL_ERROR: %s: %s", ticker, exc)
                  tiering_result["four_hour_operational"] = four_hour_operational.error_four_hour_object(str(exc))
          '''
          new_block = '''    # Phase R4H-2: preserve the old Phase-14F operational read as a
              # diagnostic/rollback proxy, then build REAL 4H from the SAME 60m
              # request already used by the 1H engine. No second provider call.
              proxy_operational = timeframe_alignment.derive_operational_timeframe(
                  tiering_result.get("trade_location") or {},
                  tiering_result.get("one_hour_entry") or {},
              )
              try:
                  env = one_hour_envelope if isinstance(one_hour_envelope, dict) else {}
                  real_four_hour = four_hour_operational.build_four_hour_operational_context(
                      ticker,
                      tiering_result,
                      enriched_data=enriched,
                      four_hour_bars=env.get("four_hour"),
                      config=config,
                  )
              except Exception as exc:
                  log.warning("FOUR_HOUR_OPERATIONAL_ERROR: %s: %s", ticker, exc)
                  real_four_hour = four_hour_operational.error_four_hour_object(str(exc))
          
              try:
                  real_four_hour["proxy_comparison"] = four_hour_operational.compare_real_vs_proxy(
                      proxy_operational.get("state"), real_four_hour
                  )
              except Exception as exc:
                  log.warning("FOUR_HOUR_PROXY_COMPARE_ERROR: %s: %s", ticker, exc)
              tiering_result["four_hour_operational"] = real_four_hour
              tiering_result["four_hour_authority"] = four_hour_authority.build_operational_authority(
                  real_four_hour, proxy_operational, config
              )
              log.info(four_hour_operational.render_four_hour_log_line(
                  ticker,
                  real_four_hour,
                  real_four_hour.get("proxy_comparison"),
              ))
          
              # MTF is built AFTER real 4H authority exists. With the R4H-2 flag
              # enabled, operational_timeframe is sourced from real candles; the
              # proxy remains separately visible and cannot overrule it.
              try:
                  tiering_result["timeframe_alignment"] = timeframe_alignment.build_timeframe_alignment_context(
                      ticker,
                      tiering_result,
                      enriched_data=enriched,
                      config=config,
                  )
              except Exception as exc:
                  log.warning("TIMEFRAME_ALIGNMENT_ERROR: %s: %s", ticker, exc)
                  tiering_result["timeframe_alignment"] = timeframe_alignment.error_timeframe_alignment_object(str(exc))
          '''
          replace_once('src/scheduler.py', old_block, new_block, 'scheduler 4H ordering')

          old_after_ladder = '''    except Exception as exc:
              log.warning("SNIPE_LADDER_ERROR: %s: %s", ticker, exc)
          
              try:
                  tiering_result = snipe_confirmed_seal.seal_snipe_confirmed_consistency(
          '''
          new_after_ladder = '''    except Exception as exc:
              log.warning("SNIPE_LADDER_ERROR: %s: %s", ticker, exc)
          
              # Phase R4H-2 path-independent capital safety. A stale/incomplete/
              # gapped/untrusted real 4H chart is missing proof, not market failure,
              # so any STARTER/SNIPE capital lands at visible NEAR_ENTRY/no-capital.
              tiering_result = four_hour_authority.enforce_operational_capital_floor(
                  tiering_result, config
              )
              authority = tiering_result.get("four_hour_authority") or {}
              if authority.get("capital_floor_enforced"):
                  log.warning(
                      "R4H2_CAPITAL_FLOOR: %s -> %s reason=%s",
                      ticker, tiering_result.get("final_tier"),
                      authority.get("capital_floor_reason"),
                  )
          
              try:
                  tiering_result = snipe_confirmed_seal.seal_snipe_confirmed_consistency(
          '''
          replace_once('src/scheduler.py', old_after_ladder, new_after_ladder, 'scheduler capital floor')

          # -----------------------------------------------------------------
          # Timeframe alignment: real authority owns operational_timeframe when
          # explicitly enabled. Legacy proxy remains a separate field.
          # -----------------------------------------------------------------
          p = Path('src/timeframe_alignment.py')
          text = p.read_text(encoding='utf-8')
          marker = '# ---------------------------------------------------------------------------\n# Canonical enums (mandatory — emitting an unlisted value is a test failure)\n'
          assert text.count(marker) == 1
          text = text.replace(marker, 'from src import four_hour_authority\n\n' + marker)

          text = text.replace(
              '_CAP_4H_HOSTILE          = 59\n',
              '_CAP_4H_HOSTILE          = 59\n_CAP_REAL_4H_UNTRUSTED   = 59\n',
              1,
          )

          old_default = '''        "operational_timeframe": _blank_layer("4H", "OPERATIONAL_LOCATION"),
                  "trigger_timeframe": _blank_layer("1H", "TRIGGER_PROOF"),
          '''
          new_default = '''        "operational_timeframe": _blank_layer("4H", "OPERATIONAL_LOCATION"),
                  "operational_proxy_timeframe": _blank_layer("4H", "OPERATIONAL_PROXY_ROLLBACK"),
                  "operational_authority": {
                      "authority_mode": None, "authority_status": None,
                      "authority_usable": False, "blocks_capital": False,
                      "proxy_state": None,
                  },
                  "trigger_timeframe": _blank_layer("1H", "TRIGGER_PROOF"),
          '''
          assert text.count(old_default) == 1
          text = text.replace(old_default, new_default)

          old_sources = '''    trade_location = tiering_result.get("trade_location") or {}
              one_hour = tiering_result.get("one_hour_entry") or {}
          
              # ---- Per-layer derivation (read-only) ---------------------------------
              weekly = derive_campaign_timeframe(signal, tiering_result, enriched)
              daily = derive_swing_timeframe(tiering_result, signal)
              operational = derive_operational_timeframe(trade_location, one_hour)
              trigger = derive_trigger_timeframe_from_one_hour_entry(one_hour)
          
              obj["campaign_timeframe"] = weekly
              obj["swing_timeframe"] = daily
              obj["operational_timeframe"] = operational
              obj["trigger_timeframe"] = trigger
          '''
          new_sources = '''    trade_location = tiering_result.get("trade_location") or {}
              one_hour = tiering_result.get("one_hour_entry") or {}
              authority = tiering_result.get("four_hour_authority") or {}
          
              # ---- Per-layer derivation (read-only) ---------------------------------
              weekly = derive_campaign_timeframe(signal, tiering_result, enriched)
              daily = derive_swing_timeframe(tiering_result, signal)
              proxy_operational = derive_operational_timeframe(trade_location, one_hour)
              use_real = tfa_cfg.get("real_4h_authority_enabled") is True
              if use_real:
                  if not isinstance(authority, dict) or not authority:
                      authority = four_hour_authority.build_operational_authority(
                          tiering_result.get("four_hour_operational"), proxy_operational, config
                      )
                  operational = four_hour_authority.operational_layer(authority)
              else:
                  operational = proxy_operational
              trigger = derive_trigger_timeframe_from_one_hour_entry(one_hour)
          
              obj["campaign_timeframe"] = weekly
              obj["swing_timeframe"] = daily
              obj["operational_timeframe"] = operational
              obj["operational_proxy_timeframe"] = proxy_operational
              obj["operational_authority"] = {
                  "authority_mode": authority.get("authority_mode") if use_real else four_hour_authority.PROXY_MODE,
                  "authority_status": authority.get("authority_status") if use_real else four_hour_authority.DISABLED,
                  "authority_usable": authority.get("authority_usable") is True if use_real else False,
                  "blocks_capital": authority.get("blocks_capital") is True if use_real else False,
                  "proxy_state": proxy_operational.get("state"),
              }
              obj["trigger_timeframe"] = trigger
          '''
          assert text.count(old_sources) == 1
          text = text.replace(old_sources, new_sources)

          old_missing = '''    missing = []
              if not trade_location or operational["state"] == "UNKNOWN":
                  missing.append("4H operational location unavailable (no trade_location context)")
              if not one_hour or trigger["state"] == "UNKNOWN":
          '''
          new_missing = '''    missing = []
              if use_real and operational.get("authority_usable") is not True:
                  failures = authority.get("trust_failures") if isinstance(authority, dict) else []
                  suffix = "; ".join(str(x) for x in (failures or [])[:3])
                  missing.append(
                      "real 4H operational authority unavailable" + (f": {suffix}" if suffix else "")
                  )
              elif operational["state"] == "UNKNOWN":
                  missing.append("4H operational location unavailable")
              if not one_hour or trigger["state"] == "UNKNOWN":
          '''
          assert text.count(old_missing) == 1
          text = text.replace(old_missing, new_missing)

          old_conflict = '''    # 2. Legacy-vs-1H contradiction (executable tier vs failed/stale 1H proof).
          '''
          new_conflict = '''    # R4H-2 data-authority conflict: capital cannot stand on an untrusted
              # real 4H chart. This is missing evidence, not a fabricated market failure.
              if layers["4H"].get("blocks_capital") and capital_action in _CAPITAL_ENTRY_ACTIONS:
                  conflicts.append({
                      "layer": "4H",
                      "reason": "real 4H authority untrusted while capital action implies entry",
                  })
          
              # 2. Legacy-vs-1H contradiction (executable tier vs failed/stale 1H proof).
          '''
          assert text.count(old_conflict) == 1
          text = text.replace(old_conflict, new_conflict)

          old_caps = '''    if layers["4H"]["state"] == "LOCATION_HOSTILE":
                  add("FOUR_HOUR_HOSTILE_LOCATION", _CAP_4H_HOSTILE, "4H operational location hostile")
              if layers["1H"]["state"] == "TRIGGER_FAILED":
          '''
          new_caps = '''    if layers["4H"]["state"] == "LOCATION_HOSTILE":
                  add("FOUR_HOUR_HOSTILE_LOCATION", _CAP_4H_HOSTILE, "4H operational location hostile")
              if layers["4H"].get("blocks_capital"):
                  add("REAL_4H_AUTHORITY_UNTRUSTED", _CAP_REAL_4H_UNTRUSTED,
                      "real 4H evidence is not trusted for capital authority")
              if layers["1H"]["state"] == "TRIGGER_FAILED":
          '''
          assert text.count(old_caps) == 1
          text = text.replace(old_caps, new_caps)

          text = text.replace(
              '    """4H operational location.\n\n    Sourced from tiering_result["trade_location"].location_state (the scanner\'s\n',
              '    """Legacy Phase-14F operational proxy (rollback/diagnostic in R4H-2).\n\n    Sourced from tiering_result["trade_location"].location_state (the scanner\'s\n',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # Ladder: when R4H-2 is active, untrusted authority cannot create a
          # base-alive capital basket; trusted EXTENDED remains repair-only and
          # cannot be upgraded to functionally-valid full-size repair.
          # -----------------------------------------------------------------
          p = Path('src/snipe_ladder_judgment.py')
          text = p.read_text(encoding='utf-8')
          old_card = '''    htf = obj.get("higher_timeframe_context") if isinstance(obj.get("higher_timeframe_context"), dict) else {}
              tl = obj.get("trade_location") if isinstance(obj.get("trade_location"), dict) else {}
          '''
          new_card = '''    htf = obj.get("higher_timeframe_context") if isinstance(obj.get("higher_timeframe_context"), dict) else {}
              tl = obj.get("trade_location") if isinstance(obj.get("trade_location"), dict) else {}
              r4h_auth = obj.get("four_hour_authority") if isinstance(obj.get("four_hour_authority"), dict) else {}
          '''
          assert text.count(old_card) == 1
          text = text.replace(old_card, new_card)

          old_return = '''        "monthly": _s(htf.get("monthly_bias")),
                  "price_below_inval": (price is not None and inval_level is not None and price < inval_level),
          '''
          new_return = '''        "monthly": _s(htf.get("monthly_bias")),
                  "real4h_active": _s(r4h_auth.get("authority_mode")) == "REAL_4H_OPERATIONAL_AUTHORITY",
                  "real4h_usable": r4h_auth.get("authority_usable") is True,
                  "price_below_inval": (price is not None and inval_level is not None and price < inval_level),
          '''
          assert text.count(old_return) == 1
          text = text.replace(old_return, new_return)

          old_base = '''    if hard:
                  return False
              if c["structure"] not in _VALID_STRUCTURES:
          '''
          new_base = '''    if hard:
                  return False
              if c.get("real4h_active") and not c.get("real4h_usable"):
                  return False
              if c["structure"] not in _VALID_STRUCTURES:
          '''
          assert text.count(old_base) == 1
          text = text.replace(old_base, new_base)

          old_4h = '''    if c["four_h"] in ("LOCATION_REPAIRING", "LOCATION_EXTENDED"):
                  # Repairing inside a real defended zone (retest truth + price above
                  # invalidation) is a live entry neighborhood, not a broken location.
                  if c["retest_truth"] in _REAL_RETEST_TRUTHS and not c["price_below_inval"]:
                      return "REPAIRING_IN_ZONE"
                  return "REPAIRING"
          '''
          new_4h = '''    if c["four_h"] == "LOCATION_REPAIRING":
                  # Repairing inside a real defended zone (retest truth + price above
                  # invalidation) is a live entry neighborhood, not a broken location.
                  if c["retest_truth"] in _REAL_RETEST_TRUTHS and not c["price_below_inval"]:
                      return "REPAIRING_IN_ZONE"
                  return "REPAIRING"
              if c["four_h"] == "LOCATION_EXTENDED":
                  # Under R4H-2, a genuinely extended real 4H neighborhood cannot
                  # become full-size merely because 1H retest proof is clean. Legacy
                  # proxy mode preserves the pre-R4H-2 behavior for rollback parity.
                  if (not c.get("real4h_active")
                          and c["retest_truth"] in _REAL_RETEST_TRUTHS
                          and not c["price_below_inval"]):
                      return "REPAIRING_IN_ZONE"
                  return "REPAIRING"
          '''
          assert text.count(old_4h) == 1
          text = text.replace(old_4h, new_4h)

          old_starter = '''    if not alive and not hard:
                  if c["retest_truth"] not in _REAL_RETEST_TRUTHS:
          '''
          new_starter = '''    if not alive and not hard:
                  if c.get("real4h_active") and not c.get("real4h_usable"):
                      starter_blockers.append("real 4H authority untrusted (capital blocked; proxy diagnostic only)")
                  if c["retest_truth"] not in _REAL_RETEST_TRUTHS:
          '''
          assert text.count(old_starter) == 1
          text = text.replace(old_starter, new_starter)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Compile and run full scanner suite
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m compileall -q src tests main.py
          python -m pytest -q
      - name: Commit verified R4H-2 refactor and remove temporary workflow
        run: |
          rm -f .github/workflows/r4h2-authority-refactor.yml .r4h2-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase R4H-2 hand operational authority to real 4H"
          git push origin HEAD:phase-r4h2-real-four-hour-authority
