name: Phase 14S.4 Validation

on:
  pull_request:
    branches:
      - phase-14s4-final-tier-dedup-reconciliation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Phase 14S.4 targeted regression
        run: |
          pytest -q tests/test_phase_14s4_final_tier_dedup_reconciliation.py

      - name: SNIPE doctrine regression stack
        run: |
          pytest -q \
            tests/test_phase_14s_unified_snipe_ladder.py \
            tests/test_phase_14q_snipe_blocker_taxonomy.py \
            tests/test_phase_14r_snipe_drought_audit.py

      - name: Scheduler regression
        run: |
          pytest -q tests/test_scheduler.py

      - name: Full suite excluding scheduler
        run: |
          pytest -q tests/ --ignore=tests/test_scheduler.py
