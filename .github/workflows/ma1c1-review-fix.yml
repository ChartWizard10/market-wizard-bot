name: MA-1C.1 Review Correction

on:
  push:
    branches: [phase-ma1c1-conditional-narrative-hotfix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-ma1c1-conditional-narrative-hotfix
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply review correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('src/discord_alerts.py')
          text = src.read_text()
          marker = 'Phase MA-1C.1: distinguish affirmative proof claims from future conditions.'

          if marker not in text:
              old_regex = '''# Phase MA-1C.1: scope proof-claim cooling to affirmative Why narrative.
          # Future/conditional instructions (Next:, upgrade triggers, blockers) must
          # preserve phrases such as "wait until confirmed retest"; rewriting those
          # phrases can invert the operator instruction. The live defect originated
          # in affirmative Why: prose, so MA-1C proof cooling is intentionally scoped
          # to that line while the existing dedicated EXECUTION/1H blocks stay sovereign.
          _OH_REASON_LINE_RE = re.compile(
              r"^([ \\t]*Why:[ \\t]*)(.*)$", re.MULTILINE
          )
          '''
              new_regex = '''# Phase MA-1C.1: distinguish affirmative proof claims from future conditions.
          # Proof claims in Why/TARGETS/FORCED PARTICIPATION/other descriptive prose
          # must obey the sovereign 1H object. Conditional operator instructions must
          # retain the proof they are waiting for; cooling those phrases can invert
          # the instruction (for example, "wait until confirmed retest").
          _OH_ALERT_LINE_RE = re.compile(r"^.*$", re.MULTILINE)
          _OH_CONDITIONAL_LINE_RE = re.compile(
              r"^[ \\t]*(?:"
              r"Next|Blocker|Missing[ \\t]+conditions|Missing[ \\t]+proof|"
              r"Upgrade[ \\t]+trigger|Promote[ \\t]+on|Not[ \\t]+SNIPE"
              r"):[ \\t]*",
              re.IGNORECASE,
          )
          _OH_FUTURE_REQUIREMENT_RE = re.compile(
              r"\\b(?:wait(?:s|ing)?[ \\t]+(?:for|until)|requires?|required|needed|must)\\b",
              re.IGNORECASE,
          )
          '''
              if old_regex not in text:
                  raise SystemExit('STOP: expected MA-1C.1 regex block not found')
              text = text.replace(old_regex, new_regex, 1)

              old_sequence = '''    # Defense-in-depth: neutralize the same proof phrases anywhere else in prose.
              result = _OH_CONFIRMED_SEQUENCE_RE.sub(
                  "structure present; 1H hold not yet confirmed", result
              )

          '''
              new_sequence = '''    # Defense-in-depth is applied below line-by-line so affirmative proof claims
              # remain governed without corrupting future/conditional instructions.

          '''
              if old_sequence not in text:
                  raise SystemExit('STOP: expected sequence-cooling block not found')
              text = text.replace(old_sequence, new_sequence, 1)

              helper_start = text.find('    def _cool_affirmative_reason_line(match: re.Match) -> str:\n')
              helper_end = text.find(
                  '    result = _OH_APLUS_SETUP_RE.sub("Watch-only valid setup", result)\n',
                  helper_start,
              )
              if helper_start < 0 or helper_end < 0:
                  raise SystemExit('STOP: MA-1C.1 helper slice anchors not found')

              new_helper = (
                  '    def _cool_nonconditional_proof_line(match: re.Match) -> str:\n'
                  '        """Cool stale affirmative proof claims while preserving future conditions.\n'
                  '\n'
                  '        Known conditional alert fields and explicit future-requirement language\n'
                  '        are left verbatim. Every other descriptive line remains subject to 1H\n'
                  '        proof sovereignty, including target reasons and forced-participation\n'
                  '        prose. Display-only: no evidence, tier, capital, routing, or score change.\n'
                  '        """\n'
                  '        line = match.group(0)\n'
                  '        if (\n'
                  '            _OH_CONDITIONAL_LINE_RE.match(line)\n'
                  '            or _OH_FUTURE_REQUIREMENT_RE.search(line)\n'
                  '        ):\n'
                  '            return line\n'
                  '\n'
                  '        line = _OH_CONFIRMED_SEQUENCE_RE.sub(\n'
                  '            "structure present; 1H hold not yet confirmed", line\n'
                  '        )\n'
                  '        if not _hold_confirmed_1h:\n'
                  '            pair_replacement = (\n'
                  '                "confirmed 1H retest; closed 1H hold still pending"\n'
                  '                if _retest_confirmed_1h\n'
                  '                else "1H retest/hold proof remains incomplete"\n'
                  '            )\n'
                  '            line = _OH_CONFIRMED_RETEST_AND_CLOSED_HOLD_RE.sub(\n'
                  '                pair_replacement, line\n'
                  '            )\n'
                  '            line = _OH_CLOSED_HOLD_CLAIM_RE.sub(\n'
                  '                "closed 1H hold still pending", line\n'
                  '            )\n'
                  '            line = _OH_CONFIRMED_HOLD_CLAIM_RE.sub(\n'
                  '                "1H hold not yet confirmed", line\n'
                  '            )\n'
                  '        if not _retest_confirmed_1h:\n'
                  '            line = _OH_CONFIRMED_RETEST_CLAIM_RE.sub(\n'
                  '                "1H retest not yet confirmed", line\n'
                  '            )\n'
                  '        return line\n'
                  '\n'
                  '    result = _OH_ALERT_LINE_RE.sub(_cool_nonconditional_proof_line, result)\n'
                  '\n'
              )
              text = text[:helper_start] + new_helper + text[helper_end:]
              src.write_text(text)
              print('Applied MA-1C.1 review correction')
          else:
              print('MA-1C.1 review correction already present')

          tests = Path('tests/test_phase_ma1c_one_hour_narrative_truth.py')
          t = tests.read_text()
          test_marker = 'test_affirmative_target_and_forced_participation_claims_are_cooled'
          if test_marker not in t:
              t += '''\n\n# ===========================================================================\n# Phase MA-1C.1 review correction — affirmative non-Why prose stays governed.\n# ===========================================================================\n\ndef test_affirmative_target_and_forced_participation_claims_are_cooled():\n    body = (\n        "TARGETS\\n"\n        "  T1: $120 — confirmed retest and closed-bar hold opens the path.\\n"\n        "FORCED PARTICIPATION: buyers have confirmed hold above value.\\n"\n        "Why: confirmed retest and closed-bar hold at the FVG."\n    )\n    out = _guard(body)\n\n    assert "T1: $120 — confirmed 1H retest; closed 1H hold still pending opens the path." in out\n    assert "FORCED PARTICIPATION: buyers have 1H hold not yet confirmed above value." in out\n    assert "Why: confirmed 1H retest; closed 1H hold still pending at the FVG." in out\n\n\ndef test_all_known_conditional_fields_preserve_future_confirmation_language():\n    oh = _one_hour(retest="NONE", hold="HOLD_WEAK")\n    lines = [\n        "Next: Wait until confirmed retest before entry.",\n        "Blocker: confirmed hold required before capital.",\n        "Missing conditions: confirmed retest; confirmed hold.",\n        "Missing proof: confirmed hold.",\n        "Upgrade trigger: confirmed retest and closed-bar hold required.",\n        "  Promote on: confirmed retest and closed-bar hold.",\n        "  Not SNIPE: full size requires confirmed hold.",\n    ]\n    out = _guard("\\n".join(lines), oh)\n    for line in lines:\n        assert line in out\n\n\ndef test_affirmative_sequence_claim_outside_why_is_cooled():\n    body = "FORCED PARTICIPATION: confirmed sequence and hold forced buyers to defend."\n    out = _guard(body)\n    assert "confirmed sequence and hold" not in out.lower()\n    assert "structure present; 1H hold not yet confirmed" in out\n\n\ndef test_explicit_future_requirement_language_is_preserved_even_without_field_label():\n    oh = _one_hour(retest="NONE", hold="HOLD_WEAK")\n    samples = [\n        "Wait until confirmed retest before entry.",\n        "Full capital requires confirmed hold.",\n        "Confirmed retest is required before adding size.",\n        "Confirmed hold needed before promotion.",\n    ]\n    for body in samples:\n        assert _guard(body, oh) == body\n'''
              tests.write_text(t)
              print('Added MA-1C.1 review regressions')
          else:
              print('MA-1C.1 review regressions already present')
          PY

      - name: Run focused regression
        shell: bash
        run: |
          python -m pytest -q tests/test_phase_ma1c_one_hour_narrative_truth.py tests/test_phase_14e1a_alert_truth_alignment.py
          python -m compileall -q src tests main.py

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet -- src/discord_alerts.py tests/test_phase_ma1c_one_hour_narrative_truth.py; then
            echo "No source/test change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/discord_alerts.py tests/test_phase_ma1c_one_hour_narrative_truth.py
          git commit -m "Phase MA-1C.1 preserve conditions while cooling affirmative proof"
          git push origin HEAD:phase-ma1c1-conditional-narrative-hotfix
