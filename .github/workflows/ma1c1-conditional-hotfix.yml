name: MA-1C.1 Conditional Narrative Hotfix

on:
  push:
    branches: [phase-ma1c1-conditional-narrative-hotfix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-ma1c1-conditional-narrative-hotfix
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply surgical MA-1C.1 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('src/discord_alerts.py')
          text = src.read_text()
          marker = 'Phase MA-1C.1: scope proof-claim cooling to affirmative Why narrative'
          if marker not in text:
              insert_anchor = '_OH_APLUS_SETUP_RE = re.compile(r"\\bA\\+[ \\t]+setup\\b", re.IGNORECASE)\n'
              if insert_anchor not in text:
                  raise SystemExit('STOP: MA-1C regex insertion anchor not found; refusing broad edit')
              reason_regex = (
                  '# Phase MA-1C.1: scope proof-claim cooling to affirmative Why narrative.\n'
                  '# Future/conditional instructions (Next:, upgrade triggers, blockers) must\n'
                  '# preserve phrases such as "wait until confirmed retest"; rewriting those\n'
                  '# phrases can invert the operator instruction. The live defect originated\n'
                  '# in affirmative Why: prose, so MA-1C proof cooling is intentionally scoped\n'
                  '# to that line while the existing dedicated EXECUTION/1H blocks stay sovereign.\n'
                  '_OH_REASON_LINE_RE = re.compile(\n'
                  '    r"^([ \\t]*Why:[ \\t]*)(.*)$", re.MULTILINE\n'
                  ')\n'
              )
              text = text.replace(insert_anchor, reason_regex + insert_anchor, 1)

              start_anchor = '    if not _hold_confirmed_1h:\n        _pair_replacement = (\n'
              end_anchor = '    result = _OH_APLUS_SETUP_RE.sub("Watch-only valid setup", result)\n'
              start = text.find(start_anchor)
              end = text.find(end_anchor, start)
              if start < 0 or end < 0:
                  raise SystemExit('STOP: MA-1C guard slice anchors not found; refusing broad edit')

              scoped_guard = (
                  '    def _cool_affirmative_reason_line(match: re.Match) -> str:\n'
                  '        """Cool stale 1H proof claims only inside affirmative Why: prose.\n'
                  '\n'
                  '        Future/conditional operator instructions elsewhere in the alert are\n'
                  '        deliberately untouched. This is display-only and does not mutate any\n'
                  '        evidence object, tier, capital state, routing, or scanner decision.\n'
                  '        """\n'
                  '        prefix, prose = match.group(1), match.group(2)\n'
                  '\n'
                  '        if not _hold_confirmed_1h:\n'
                  '            pair_replacement = (\n'
                  '                "confirmed 1H retest; closed 1H hold still pending"\n'
                  '                if _retest_confirmed_1h\n'
                  '                else "1H retest/hold proof remains incomplete"\n'
                  '            )\n'
                  '            prose = _OH_CONFIRMED_RETEST_AND_CLOSED_HOLD_RE.sub(\n'
                  '                pair_replacement, prose\n'
                  '            )\n'
                  '            prose = _OH_CLOSED_HOLD_CLAIM_RE.sub(\n'
                  '                "closed 1H hold still pending", prose\n'
                  '            )\n'
                  '            prose = _OH_CONFIRMED_HOLD_CLAIM_RE.sub(\n'
                  '                "1H hold not yet confirmed", prose\n'
                  '            )\n'
                  '        if not _retest_confirmed_1h:\n'
                  '            prose = _OH_CONFIRMED_RETEST_CLAIM_RE.sub(\n'
                  '                "1H retest not yet confirmed", prose\n'
                  '            )\n'
                  '\n'
                  '        return prefix + prose\n'
                  '\n'
                  '    result = _OH_REASON_LINE_RE.sub(_cool_affirmative_reason_line, result)\n'
                  '\n'
              )
              text = text[:start] + scoped_guard + text[end:]
              src.write_text(text)
              print('Applied MA-1C.1 source hotfix')
          else:
              print('MA-1C.1 source hotfix already present')

          tests = Path('tests/test_phase_ma1c_one_hour_narrative_truth.py')
          t = tests.read_text()
          test_marker = 'test_future_retest_requirement_outside_reason_is_preserved'
          if test_marker not in t:
              t += '''\n\n# ===========================================================================\n# Phase MA-1C.1 — conditional/future wording must never be inverted.\n# ===========================================================================\n\ndef test_future_retest_requirement_outside_reason_is_preserved():\n    oh = _one_hour(retest="NONE", hold="HOLD_WEAK")\n    body = (\n        "Next: Wait until confirmed retest before entry.\\n"\n        "Upgrade trigger: confirmed retest required before any capital.\\n"\n        "Why: confirmed retest and closed-bar hold at the FVG."\n    )\n    out = _guard(body, oh)\n\n    assert "Next: Wait until confirmed retest before entry." in out\n    assert "Upgrade trigger: confirmed retest required before any capital." in out\n    assert "Why: 1H retest/hold proof remains incomplete" in out\n\n\ndef test_future_hold_requirement_outside_reason_is_preserved():\n    body = (\n        "Next: Wait for confirmed hold before adding size.\\n"\n        "Why: confirmed hold at value."\n    )\n    out = _guard(body)\n\n    assert "Next: Wait for confirmed hold before adding size." in out\n    assert "Why: 1H hold not yet confirmed at value." in out\n\n\ndef test_bare_future_retest_instruction_is_noop():\n    oh = _one_hour(retest="NONE", hold="HOLD_WEAK")\n    body = "Wait until confirmed retest before entry."\n    assert _guard(body, oh) == body\n\n\ndef test_bare_future_hold_instruction_is_noop():\n    body = "Wait for confirmed hold before adding size."\n    assert _guard(body) == body\n'''
              tests.write_text(t)
              print('Added MA-1C.1 regression tests')
          else:
              print('MA-1C.1 tests already present')
          PY

      - name: Run focused regression
        shell: bash
        run: |
          python -m pytest -q tests/test_phase_ma1c_one_hour_narrative_truth.py tests/test_phase_14e1a_alert_truth_alignment.py
          python -m compileall -q src tests main.py

      - name: Commit source and tests
        shell: bash
        run: |
          if git diff --quiet -- src/discord_alerts.py tests/test_phase_ma1c_one_hour_narrative_truth.py; then
            echo "No source/test change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/discord_alerts.py tests/test_phase_ma1c_one_hour_narrative_truth.py
          git commit -m "Phase MA-1C.1 preserve conditional 1H proof instructions"
          git push origin HEAD:phase-ma1c1-conditional-narrative-hotfix
