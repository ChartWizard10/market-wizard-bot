name: Phase 92-1A Branch Patch Gate

on:
  push:
    branches:
      - phase-92-1a-published-alert-ledger

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-92-1a-published-alert-ledger
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply surgical integration
        run: python scripts/phase92_1a_branch_patch.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Compile production and tests
        run: python -m compileall -q src tests main.py

      - name: Focused Phase 92-1A tests
        run: |
          pytest -q tests/test_phase92_1a_published_alert_ledger.py
          pytest -q tests/test_scheduler.py tests/test_phase_14w_manual_analyze_parity.py

      - name: Full production suite
        run: pytest -q

      - name: Commit only after green gates
        shell: bash
        run: |
          rm -f .github/workflows/phase92-1a-branch-patch.yml
          rm -f scripts/phase92_1a_branch_patch.py
          git config user.name "ChartWizard10"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Phase 92-1A: wire immutable published-alert ledger"
          git push origin HEAD:phase-92-1a-published-alert-ledger
