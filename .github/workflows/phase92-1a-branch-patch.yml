name: Phase 92-1A Branch Patch Gate

on:
  push:
    branches:
      - phase-92-1a-published-alert-ledger

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-92-1a-published-alert-ledger
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply surgical Phase 92-1A integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # -----------------------------------------------------------------
          # 1. Correct the new ledger schema against actual production organs.
          # -----------------------------------------------------------------
          p = Path('src/signal_outcome_ledger.py')
          src = p.read_text(encoding='utf-8')

          old = '''def _event_id(
              scan_id: str,
              ticker: str,
              final_tier: str,
              dedup_key: str | None,
              origin: str,
          ) -> str:
              basis = "|".join(
                  [VERSION, scan_id, ticker.upper(), final_tier, dedup_key or "", origin]
              )
          '''
          new = '''def _event_id(
              scan_id: str,
              ticker: str,
              final_tier: str,
              dedup_key: str | None,
              origin: str,
              scan_started_at: str,
          ) -> str:
              # scan_started_at is part of identity because manual !analyze scan IDs
              # historically contain only HHMMSS and may repeat on another date.
              basis = "|".join(
                  [
                      VERSION,
                      scan_id,
                      ticker.upper(),
                      final_tier,
                      dedup_key or "",
                      origin,
                      scan_started_at,
                  ]
              )
          '''
          if old not in src:
              raise SystemExit('STOP: _event_id anchor not found')
          src = src.replace(old, new, 1)
          old_call = '_event_id(scan_id, ticker, final_tier, dedup_key, origin)'
          new_call = '_event_id(scan_id, ticker, final_tier, dedup_key, origin, scan_started_at)'
          if old_call not in src:
              raise SystemExit('STOP: _event_id call anchor not found')
          src = src.replace(old_call, new_call, 1)

          start = src.index('def _four_hour_projection(')
          end = src.index('\ndef _ladder_projection(', start)
          replacement = '''def _four_hour_projection(tiering_result: dict) -> dict | None:
              """Project the actual R4H-1 schema without inventing proxy-shaped keys."""
              four = tiering_result.get("four_hour_operational")
              if not isinstance(four, dict):
                  return None
              bar = four.get("bar_context") if isinstance(four.get("bar_context"), dict) else {}
              return {
                  "status": _text(four.get("status")),
                  "engine_version": _text(four.get("engine_version")),
                  "authority_mode": _text(four.get("authority_mode")),
                  "structural_state": _text(four.get("structural_state")),
                  "state_confidence": _text(four.get("state_confidence")),
                  "operational_location": _text(four.get("operational_location")),
                  "operational_readiness": _text(four.get("operational_readiness")),
                  "bar_context": {
                      "last_closed_4h_time": _text(bar.get("last_closed_4h_time")),
                      "current_live_4h_time": _text(bar.get("current_live_4h_time")),
                      "live_bar_available": bar.get("live_bar_available") if isinstance(bar.get("live_bar_available"), bool) else None,
                      "last_closed_source_complete": bar.get("last_closed_source_complete") if isinstance(bar.get("last_closed_source_complete"), bool) else None,
                      "using_live_bar_for_confirmation": bar.get("using_live_bar_for_confirmation") if isinstance(bar.get("using_live_bar_for_confirmation"), bool) else None,
                      "freshness_status": _text(bar.get("freshness_status")),
                  },
                  "retest_truth": _json_safe(four.get("retest_truth")),
                  "hold_truth": _json_safe(four.get("hold_truth")),
                  "invalidation_quality": _json_safe(four.get("invalidation_quality")),
                  "target_path": _json_safe(four.get("target_path")),
                  "daily_relationship": _text(four.get("daily_relationship")),
                  "hard_failures": _string_list(four.get("hard_failures")),
                  "soft_warnings": _string_list(four.get("soft_warnings")),
                  "missing_proofs": _string_list(four.get("missing_proofs")),
                  "proxy_comparison": _json_safe(four.get("proxy_comparison")),
              }

          '''
          src = src[:start] + replacement + src[end + 1:]

          start = src.index('def _ladder_projection(')
          end = src.index('\ndef _audit_projection(', start)
          replacement = '''def _ladder_projection(tiering_result: dict) -> dict | None:
              ladder = tiering_result.get("snipe_ladder")
              if not isinstance(ladder, dict):
                  return None
              return _projection(
                  ladder,
                  (
                      "internal_ladder_tier",
                      "public_signal_tier",
                      "existing_final_tier_recommendation",
                      "capital_action_recommendation",
                      "opportunity_lane",
                      "starter_grade",
                      "sniper_grade",
                      "base_alive",
                      "proof_state",
                      "proof_failure",
                      "structure_state",
                      "location_state",
                      "trigger_state",
                      "candle_state",
                      "risk_state",
                      "hard_failures",
                      "starter_blockers",
                      "sniper_only_blockers",
                      "soft_caps",
                      "info_notes",
                      "basket_reason",
                      "why_this_ladder_tier",
                      "why_not_higher",
                      "why_not_lower",
                      "next_promotion_proof",
                      "failure_condition",
                      "audit_tags",
                      "snipe_capital_floor_violation",
                  ),
              )

          '''
          src = src[:start] + replacement + src[end + 1:]

          old = '"alert_id": _event_id(scan_id, ticker, final_tier, dedup_key, origin),'
          new = '"alert_id": _event_id(scan_id, ticker, final_tier, dedup_key, origin, scan_started_at),'
          if old in src:
              src = src.replace(old, new, 1)
          # The prior call may already have been replaced above depending on formatting.

          old = '"chunks": _finite_number(send_result.get("chunks") or send_result.get("chunk_count")),'
          if old in src:
              src = src.replace(
                  old,
                  '"message_count": _finite_number(send_result.get("message_count") or send_result.get("chunks") or send_result.get("chunk_count")),',
                  1,
              )

          old = '"why_this_tier": _text((ladder or {}).get("why_this_tier")),'
          new = '"why_this_tier": _text((ladder or {}).get("why_this_ladder_tier")),'
          if old not in src:
              raise SystemExit('STOP: ladder narrative key anchor not found')
          src = src.replace(old, new, 1)

          old = '"next_promotion_proof": _text((ladder or {}).get("next_promotion_proof")),'
          new = '"next_promotion_proof": _json_safe((ladder or {}).get("next_promotion_proof")),'
          if old not in src:
              raise SystemExit('STOP: promotion proof anchor not found')
          src = src.replace(old, new, 1)

          p.write_text(src, encoding='utf-8')

          # -----------------------------------------------------------------
          # 2. Activate a dedicated commercial storage jurisdiction.
          # -----------------------------------------------------------------
          p = Path('config/doctrine_config.yaml')
          cfg = p.read_text(encoding='utf-8')
          anchor = '''research_archive:
            enabled: true
            directory: ".state/research_archive"
            retention_days: 120
            max_daily_file_bytes: 10485760

          state:
          '''
          replacement = '''research_archive:
            enabled: true
            directory: ".state/research_archive"
            retention_days: 120
            max_daily_file_bytes: 10485760

          # Phase 92 commercial evidence store. Separate from operational dedup
          # state and from the research archive. This records only successfully
          # delivered Discord alerts and has zero strategy/capital authority.
          signal_outcomes:
            enabled: true
            directory: ".state/signal_outcomes"

          state:
          '''
          if anchor not in cfg:
              raise SystemExit('STOP: config research/state anchor not found')
          cfg = cfg.replace(anchor, replacement, 1)
          p.write_text(cfg, encoding='utf-8')

          # -----------------------------------------------------------------
          # 3. Wire ledger only after successful Discord delivery.
          # -----------------------------------------------------------------
          p = Path('src/scheduler.py')
          sch = p.read_text(encoding='utf-8')

          anchor = 'from src import scan_telemetry\nfrom src import score_calibration\n'
          replacement = 'from src import scan_telemetry\nfrom src import signal_outcome_ledger\nfrom src import score_calibration\n'
          if anchor not in sch:
              raise SystemExit('STOP: scheduler import anchor not found')
          sch = sch.replace(anchor, replacement, 1)

          helper_anchor = '''    return _attach_capacity_boundary(trace, capacity_boundary)


# ---------------------------------------------------------------------------
# Phase 14W — one shared post-tiering candidate judgment organ
# ---------------------------------------------------------------------------
          '''
          helper_replacement = '''    return _attach_capacity_boundary(trace, capacity_boundary)


async def _record_published_event_isolated(
    *,
    ticker: str,
    tiering_result: dict,
    dedup_decision: dict | None,
    send_result: dict,
    config: dict,
    scan_id: str,
    scan_started_at: str,
    system_prompt: str,
    origin: str,
    tickers: list | tuple | None = None,
) -> dict:
    """Persist Phase-92 published-alert evidence without owning scanner truth.

    The call happens only after Discord reports successful delivery. File I/O
    runs off the event loop, and every failure is isolated: tier, capital,
    routing, state continuity, dedup, and Discord truth are never changed.
    """
    try:
        result = await asyncio.to_thread(
            signal_outcome_ledger.append_published_event,
            ticker=ticker,
            tiering_result=tiering_result,
            dedup_decision=dedup_decision,
            send_result=send_result,
            config=config,
            scan_id=scan_id,
            scan_started_at=scan_started_at,
            system_prompt=system_prompt,
            origin=origin,
            tickers=tickers,
        )
    except Exception as exc:  # pragma: no cover - defensive isolation boundary
        log.critical("SIGNAL_OUTCOME_LEDGER_UNCAUGHT: %s: %s", ticker, exc)
        return {"ok": False, "status": "uncaught_error", "error": str(exc)}

    if not isinstance(result, dict) or result.get("ok") is not True:
        log.critical(
            "SIGNAL_OUTCOME_LEDGER_DEGRADED: ticker=%s scan_id=%s status=%s error=%s",
            ticker,
            scan_id,
            result.get("status") if isinstance(result, dict) else "invalid_result",
            result.get("error") if isinstance(result, dict) else "",
        )
    return result if isinstance(result, dict) else {"ok": False, "status": "invalid_result"}


# ---------------------------------------------------------------------------
# Phase 14W — one shared post-tiering candidate judgment organ
# ---------------------------------------------------------------------------
          '''
          if helper_anchor not in sch:
              raise SystemExit('STOP: scheduler helper anchor not found')
          sch = sch.replace(helper_anchor, helper_replacement, 1)

          sent_anchor = '''        if send_result.get("sent"):
            alerts_sent += 1
            try:
                state_store.record_alert(ticker, tiering_result, state, config, scan_id)
            except Exception as exc:
                log.critical("CRITICAL: state record failed: %s: %s", ticker, exc)
          '''
          sent_replacement = '''        if send_result.get("sent"):
            alerts_sent += 1
            await _record_published_event_isolated(
                ticker=ticker,
                tiering_result=tiering_result,
                dedup_decision=dedup_decision,
                send_result=send_result,
                config=config,
                scan_id=scan_id,
                scan_started_at=started_at,
                system_prompt=system_prompt,
                origin=(
                    signal_outcome_ledger.ORIGIN_MANUAL_SCAN
                    if is_manual
                    else signal_outcome_ledger.ORIGIN_SCHEDULED_SCAN
                ),
                tickers=tickers,
            )
            try:
                state_store.record_alert(ticker, tiering_result, state, config, scan_id)
            except Exception as exc:
                log.critical("CRITICAL: state record failed: %s: %s", ticker, exc)
          '''
          if sent_anchor not in sch:
              raise SystemExit('STOP: autoscan successful-send anchor not found')
          sch = sch.replace(sent_anchor, sent_replacement, 1)

          analyze_anchor = '''    async with lock:
        scan_id = f"analyze_{ticker}_{datetime.utcnow().strftime('%H%M%S')}"
          '''
          analyze_replacement = '''    async with lock:
        started_at = datetime.utcnow().isoformat()
        scan_id = f"analyze_{ticker}_{datetime.utcnow().strftime('%H%M%S')}"
          '''
          if analyze_anchor not in sch:
              raise SystemExit('STOP: manual analyze timestamp anchor not found')
          sch = sch.replace(analyze_anchor, analyze_replacement, 1)

          analyze_sent_anchor = '''        if send_result.get("sent"):
            state_store.record_alert(ticker, tiering_result, state, config, scan_id)
            try:
                state_store.save(state, config)
            except Exception as exc:
                log.critical("CRITICAL: state write failed after !analyze: %s", exc)
          '''
          analyze_sent_replacement = '''        if send_result.get("sent"):
            await _record_published_event_isolated(
                ticker=ticker,
                tiering_result=tiering_result,
                dedup_decision=dedup_decision,
                send_result=send_result,
                config=config,
                scan_id=scan_id,
                scan_started_at=started_at,
                system_prompt=system_prompt,
                origin=signal_outcome_ledger.ORIGIN_MANUAL_ANALYZE,
                tickers=None,
            )
            state_store.record_alert(ticker, tiering_result, state, config, scan_id)
            try:
                state_store.save(state, config)
            except Exception as exc:
                log.critical("CRITICAL: state write failed after !analyze: %s", exc)
          '''
          if analyze_sent_anchor not in sch:
              raise SystemExit('STOP: manual analyze successful-send anchor not found')
          sch = sch.replace(analyze_sent_anchor, analyze_sent_replacement, 1)

          p.write_text(sch, encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Compile production and tests
        run: python -m compileall -q src tests main.py

      - name: Run Phase 92-1A focused tests
        run: |
          pytest -q tests/test_phase92_1a_published_alert_ledger.py
          pytest -q tests/test_scheduler.py tests/test_phase_14w_manual_analyze_parity.py

      - name: Run full production suite
        run: pytest -q

      - name: Remove temporary workflow and commit only green production changes
        shell: bash
        run: |
          rm -f .github/workflows/phase92-1a-branch-patch.yml
          git config user.name "ChartWizard10"
          git config user.email "actions@users.noreply.github.com"
          git add src/signal_outcome_ledger.py src/scheduler.py config/doctrine_config.yaml tests/test_phase92_1a_published_alert_ledger.py .github/workflows/phase92-1a-branch-patch.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Phase 92-1A: wire immutable published-alert ledger"
          git push origin HEAD:phase-92-1a-published-alert-ledger
