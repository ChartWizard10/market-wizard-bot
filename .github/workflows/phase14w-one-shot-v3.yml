name: Phase 14W One-Shot Line-Safe Refactor

on:
  push:
    branches: [phase-14w-manual-analyze-parity]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-14w-manual-analyze-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Refactor scheduler with structural line boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/scheduler.py')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          if any('def _complete_candidate_judgment(' in x for x in lines):
              raise SystemExit('shared helper already present')

          def find(sub, start=0):
              for i in range(start, len(lines)):
                  if sub in lines[i]:
                      return i
              raise AssertionError(f'not found: {sub}')

          scan_i = find('async def run_scan_pipeline(')
          s = find('# Step 6.5: Trajectory', scan_i)
          e = find('# Step 6.7: FINAL-tier truth', s)
          shared = lines[s:e]

          # Remove scan-only ladder telemetry try-block.
          k = next(i for i,x in enumerate(shared) if '_tlm_basket =' in x)
          ks = k
          while ks > 0 and shared[ks].strip() != 'try:':
              ks -= 1
          ke = k
          while ke < len(shared)-1:
              if shared[ke].strip() == 'pass' and ke > 0 and shared[ke-1].lstrip().startswith('except Exception'):
                  ke += 1
                  if ke < len(shared) and not shared[ke].strip():
                      ke += 1
                  break
              ke += 1
          shared = shared[:ks] + shared[ke:]

          # Remove scan-only final-served telemetry block.
          ss = next(i for i,x in enumerate(shared) if 'Phase 14V.1 (B1)' in x)
          se = next(i for i,x in enumerate(shared[ss:], ss) if '# Step 6.6: Score calibration' in x)
          shared = shared[:ss] + shared[se:]

          # Trajectory gets caller-resolved prior state.
          shared = [x for x in shared if '_ticker_states = state.get(' not in x and '_previous_state = _ticker_states.get(' not in x]
          shared = [x.replace('tiering_result, _previous_state', 'tiering_result, previous_state') for x in shared]
          shared = [x.replace('enriched_map.get(ticker, {})', 'enriched') for x in shared]
          shared = [x.replace('market_results.get(ticker) or {}', 'market_result or {}') for x in shared]
          blob = ''.join(shared)
          for forbidden in ('_tlm_', 'enriched_map', 'market_results', 'state.get('):
              assert forbidden not in blob, forbidden

          # Convert 8-space loop body to 4-space function body.
          normalized = []
          for x in shared:
              if x.startswith('        '):
                  x = x[8:]
              normalized.append('    ' + x if x.strip() else x)
          helper_body = ''.join(normalized)

          helper = '''# ---------------------------------------------------------------------------\n# Phase 14W — shared post-tiering candidate judgment\n# ---------------------------------------------------------------------------\n\ndef _complete_candidate_judgment(\n    ticker: str,\n    tiering_result: dict,\n    enriched: dict,\n    market_result: dict,\n    config: dict,\n    previous_state: dict | None = None,\n) -> dict:\n    """Run the complete post-tiering chart judgment stack for one candidate.\n\n    Autoscan and manual ``!analyze`` both use this exact organ. Manual inspection\n    may bypass universe admission/cooldown; it may never bypass chart evidence,\n    SNIPE arbitration, the capital floor, or the downgrade-only truth seal.\n\n    Dedup, routing, persistence and scan-funnel telemetry remain caller concerns\n    and occur only after the final executable tier is known.\n    """\n    tiering_result = tiering_result if isinstance(tiering_result, dict) else {}\n    enriched = enriched if isinstance(enriched, dict) else {}\n    market_result = market_result if isinstance(market_result, dict) else {}\n    final_tier = tiering_result.get("final_tier", "WAIT")\n\n''' + helper_body + '''\n    return tiering_result\n\n\n'''

          replacement = '''        # Step 6.5–6.6: shared chart judgment. Phase 14W prevents\n        # autoscan/manual command drift by using one evidence/arbitration organ.\n        _ticker_states = state.get("tickers", {}) if isinstance(state, dict) else {}\n        _previous_state = _ticker_states.get(ticker) if isinstance(_ticker_states, dict) else None\n        tiering_result = _complete_candidate_judgment(\n            ticker, tiering_result, enriched_map.get(ticker, {}),\n            market_results.get(ticker) or {}, config, _previous_state,\n        )\n        final_tier = tiering_result.get("final_tier", final_tier)\n\n        # Phase 14V is scan-only observation, outside chart judgment.\n        try:\n            _tlm_basket = (tiering_result.get("snipe_ladder") or {}).get("internal_ladder_tier")\n            if _tlm_basket:\n                _tlm_baskets[_tlm_basket] = _tlm_baskets.get(_tlm_basket, 0) + 1\n        except Exception:\n            pass\n        try:\n            _tlm_served = tiering_result.get("final_tier")\n            if _tlm_served:\n                _tlm_final_tiers[_tlm_served] = _tlm_final_tiers.get(_tlm_served, 0) + 1\n                _tlm_analysis["judged"] += 1\n        except Exception:\n            pass\n\n'''.splitlines(keepends=True)

          lines = lines[:s] + replacement + lines[e:]

          # Insert helper before core pipeline marker.
          marker = next(i for i,x in enumerate(lines) if '# Core pipeline (used by both scheduled and manual scans)' in x)
          header = marker - 1
          while header > 0 and lines[header].startswith('# ---'):
              header -= 1
          # marker-1 is divider; insert before the divider for clean sectioning.
          insert_at = marker - 1
          lines[insert_at:insert_at] = helper.splitlines(keepends=True)

          # Manual shortcut replacement, found after helper insertion.
          analyze = next(i for i,x in enumerate(lines) if 'async def run_analyze(' in x)
          a = next(i for i,x in enumerate(lines[analyze:], analyze) if '# Tiering (cannot be bypassed)' in x)
          b = next(i for i,x in enumerate(lines[a:], a) if '# Alert' in x)
          manual = '''        # Deterministic tiering hard gates cannot be bypassed.\n        tiering_result = tiering.validate(cr["signal"], pf_res, config)\n\n        # Phase 14W: bypass universe admission/cooldown only. Chart judgment is\n        # identical to autoscan before execution governance is consulted.\n        state = state_store.load(config)\n        _ticker_states = state.get("tickers", {}) if isinstance(state, dict) else {}\n        _previous_state = _ticker_states.get(ticker) if isinstance(_ticker_states, dict) else None\n        tiering_result = _complete_candidate_judgment(\n            ticker, tiering_result, enriched, mres, config, _previous_state\n        )\n        final_tier = tiering_result.get("final_tier", "WAIT")\n\n        # Manual override bypasses cooldown only. WAIT/safety/routing hard blocks bind.\n        dedup_decision = state_store.check_alert(\n            tiering_result, state, config, manual_override=True\n        )\n\n'''.splitlines(keepends=True)
          lines = lines[:a] + manual + lines[b:]

          text = ''.join(lines)
          text = text.replace(
              '    Bypasses prefilter score floor and dedup cooldown.\n'
              '    Still enforces: tiering hard gates, JSON validation, safe_for_alert, WAIT suppression.\n',
              '    Bypasses universe prefilter admission and dedup cooldown only.\n'
              '    Still enforces JSON validation, deterministic tiering hard gates, the complete\n'
              '    post-tiering evidence/arbitration stack, safe_for_alert, and WAIT suppression.\n'
          )
          scan = text[text.index('async def run_scan_pipeline('):text.index('async def run_full_scan')]
          ana = text[text.index('async def run_analyze'):]
          assert scan.count('_complete_candidate_judgment(') == 1
          assert ana.count('_complete_candidate_judgment(') == 1
          assert scan.index('_complete_candidate_judgment(') < scan.index('state_store.check_alert(')
          assert ana.index('_complete_candidate_judgment(') < ana.index('state_store.check_alert(')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Compile and run complete suite
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q src tests main.py
          python -m pytest -q
      - name: Commit verified result and clean temporary controls
        run: |
          rm -f .github/workflows/phase14w-one-shot.yml .github/workflows/phase14w-one-shot-v2.yml .github/workflows/phase14w-one-shot-v3.yml .phase14w-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 14W unify manual and autoscan judgment pipeline"
          git push origin HEAD:phase-14w-manual-analyze-parity
