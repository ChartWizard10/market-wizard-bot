scan:
  ticker_file: "config/tickers.txt"
  interval_minutes: 15
  market_hours_only: true
  market_open: "09:35"
  market_close: "15:55"
  timezone: "America/New_York"

data:
  min_daily_bars: 120
  max_staleness_days: 2
  lookback_period: "18mo"
  interval: "1d"
  fetch_batch_size: 100
  fetch_delay_seconds: 0.3

disabled_indicators:
  - rsi
  - macd
  - bollinger_bands
  - stochastic

one_hour:
  enabled: true
  interval: "60m"
  lookback_period: "1mo"
  max_bars: 80

timeframe_alignment:
  enabled: true

snipe_gate_audit:
  enabled: true
  render_compact_line: false

higher_timeframe_context:
  enabled: true
  lookback_months: 60
  min_weekly_bars: 52
  min_monthly_bars: 12
  render_compact_line: false
  influence_tiering: false
  persist_history_snapshot: true

audit_access:
  enabled: true
  allowed_user_ids: []
  allowed_channel_ids:
    - 1518684614598590495
  max_rows: 3

prefilter:
  # Key name means deep-analysis candidates and is accurate: Anthropic Claude
  # is the production provider. CAP-40 is separately measured; production
  # remains 30 for now.
  max_claude_candidates_per_scan: 30
  prefilter_min_score: 55

  # Phase SFC-2A. Pure setup-family admission arbitration. This block does not
  # change candidate behavior until SFC-2B wires the green contract into the
  # prefilter. Family evidence may repair generic admission blind spots, never
  # common fatal gates and never capital authority.
  family_admission:
    enabled: true
    min_family_score: 65
    max_family_rank_score: 95

  scoring_weights:
    trend_value_alignment: 15
    structure_event: 20
    fvg_ob_demand_zone_quality: 15
    retest_proximity_status: 20
    target_path_rr_estimate: 15
    volume_participation: 10
    data_quality_recency: 5

  thresholds:
    max_price_extension_from_sma20_pct: 8
    overhead_block_distance_pct: 3
    volume_expansion_ratio: 1.2
    volume_dryup_ratio: 0.8
    fvg_lookback_bars: 30
    ob_lookback_bars: 30
    swing_lookback_bars: 60
    recent_trigger_window_bars: 10

tiers:
  snipe_it:
    min_score: 85
    min_rr: 3.0
    min_risk_distance_pct: 0.35
    requires_retest: true
    requires_hold: true
    requires_invalidation: true
  starter:
    min_score: 75
    min_rr: 3.0
    requires_retest: true
    requires_hold: true
    requires_invalidation: true
  near_entry:
    min_score: 60
    requires_missing_conditions: true
    requires_upgrade_trigger: true
  wait:
    posts_to_discord: false

discord:
  snipe_channel_id: 1497532086335311883
  starter_channel_id: 1497532177359962112
  near_entry_channel_id: 1497532274470551693
  scan_log_channel_id: null

# Production deep-analysis provider: Anthropic Claude. main.py instantiates
# anthropic.AsyncAnthropic and the scheduler calls it natively through
# src/claude_client.py — there is no adapter and no secondary provider.
#
# Model routing: ANTHROPIC_MODEL -> this value -> DEFAULT_CLAUDE_MODEL.
# Pacing values are consumed by src/claude_client.py and are unchanged.
claude:
  model: "claude-opus-5"
  max_tokens: 1200
  max_concurrent_calls: 8
  claude_concurrency: 1
  claude_min_seconds_between_calls: 4
  claude_max_input_tokens_per_minute_budget: 25000

telemetry:
  max_scan_summaries: 300
  max_decision_traces: 9000

# CAP-40D forward-study persistence. This archive is research-only and stores
# compact already-built scan evidence so CAP-40C/R4H-3C cohorts survive the
# bounded Phase-14V ring. It has no tier/capital/routing/candidate-cap authority.
research_archive:
  enabled: true
  directory: ".state/research_archive"
  retention_days: 120
  max_daily_file_bytes: 10485760

state:
  cooldown_minutes: 60
  max_memory_entries: 500
  persist_to_file: true
  state_file: ".state/alert_history.json"